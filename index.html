<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marcus | Romance Chat Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#100c18;color:#f7f0ff;font-family:system-ui,-apple-system,sans-serif}.app{max-width:560px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(160deg,#231331,#100c18 65%)}header{display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid #4b365c;background:#20132c}.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#a767e6,#4d247e);display:grid;place-items:center;font-size:25px}h1{font-size:19px;margin:0}small{color:#c5b3d2}.tag{font-size:11px;color:#dfbdfb}.chat{flex:1;min-height:55vh;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;gap:13px}.bubble{max-width:86%;padding:13px 16px;border-radius:18px;line-height:1.45;white-space:pre-wrap}.him{align-self:flex-start;background:#342441;border-bottom-left-radius:4px}.me{align-self:flex-end;background:#7c32bb;border-bottom-right-radius:4px}.meta{font-size:11px;opacity:.65;margin-top:6px}form{display:flex;gap:8px;padding:12px;background:#20132c;border-top:1px solid #4b365c}input{flex:1;min-width:0;border:1px solid #634677;border-radius:22px;padding:14px;background:#130d1d;color:white;font-size:16px}button{border:0;border-radius:22px;background:#a84af1;color:white;font-weight:700;padding:0 17px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid white}.tools{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;color:#c9b7d7;font-size:12px}.tools button{padding:7px 11px;font-size:12px;background:#49315d}.notice{font-size:12px;color:#cbbbd3;text-align:center;padding:8px 18px}</style></head><body><main class="app"><header><div class="avatar" aria-hidden="true">💜</div><div><h1>Marcus, 42</h1><small>Sweet • Confident • Thoughtful</small><div class="tag">Fictional character · Scripted demo</div></div></header><div class="tools"><span>Private demo · saved on this device</span><button id="clear" type="button">Start over</button></div><section class="chat" id="chat" aria-live="polite" aria-label="Chat conversation"></section><div class="notice">Marcus is a fictional chatbot, not a real person or live AI. Don't share sensitive information.</div><form id="form"><input id="message" aria-label="Message Marcus" placeholder="Message Marcus…" autocomplete="off" maxlength="500" required><button type="submit">Send ♡</button></form></main><script>
const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('message');const key='marcus-demo-v1';let messages;try{messages=JSON.parse(localStorage.getItem(key))||[]}catch{messages=[]}if(!Array.isArray(messages))messages=[];
const starters=["Hey, beautiful. 💜 How's your day treating you?", "There you are. I was hoping we'd get a chance to talk. How are you feeling today?"];
function add(who,text){const item={who,text:String(text).slice(0,800)};messages.push(item);messages=messages.slice(-100);localStorage.setItem(key,JSON.stringify(messages));draw(item)}
function draw(item){const bubble=document.createElement('div');bubble.className='bubble '+(item.who==='me'?'me':'him');bubble.textContent=item.text;chat.appendChild(bubble);chat.scrollTop=chat.scrollHeight}
function answer(s){const t=s.toLowerCase();if(/(good morning|morning)/.test(t))return "Good morning, sweetheart. ☀️ I hope today gives you something to smile about. What's on your schedule?";if(/(good night|goodnight|sleep)/.test(t))return "Sleep well, beautiful. 💜 I hope you wake up feeling rested. Sweet dreams.";if(/(tired|exhausted|long day|stress|rough)/.test(t))return "Sounds like you've been carrying a lot today. Want to tell me what happened, or would a little playful distraction help? 💜";if(/(work|office|job)/.test(t))return "I hope work goes smoothly for you. What's the best part of your day been so far?";if(/(sad|upset|lonely)/.test(t))return "I'm glad you told me. You deserve kindness and support. Want to talk about what's been weighing on you?";if(/(miss you|thinking of you|love you)/.test(t))return "Now that's how you make a gentleman smile. 😉 Tell me what's on your mind, beautiful.";if(/(food|dinner|lunch|hungry|eat)/.test(t))return "Now you've got me curious. What are we putting on the menu tonight? 😉";if(/(date|romance|flirt|kiss)/.test(t))return "If this were a movie, I'd plan a candlelit dinner and let you pick the music. What's your idea of a perfect date? 🌹";if(/(hello|hey|hi|how are you)/.test(t))return "Well, hello there, beautiful. 😉 I'm glad you stopped by. Tell me something good about your day.";const choices=["I like hearing about your day. Tell me a little more. 💜","You have my attention, beautiful. What happened next?","Now you've got me curious. How did that make you feel?","I appreciate you sharing that with me. What's on your mind right now?","You know, I like a woman who speaks her mind. 😉 Tell me more."];return choices[messages.filter(x=>x.who==='me').length%choices.length]}
messages.forEach(draw);if(!messages.length)add('him',starters[0]);form.addEventListener('submit',e=>{e.preventDefault();const s=input.value.trim();if(!s)return;add('me',s);input.value='';add('him',answer(s))});document.getElementById('clear').addEventListener('click',()=>{if(confirm('Erase this demo conversation and start over?')){messages=[];localStorage.removeItem(key);chat.replaceChildren();add('him',starters[1])}});
</script></body></html>
